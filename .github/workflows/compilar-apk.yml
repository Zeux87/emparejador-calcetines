name: Compilar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descargar los modelos de IA
        run: |
          set -e
          d=app/src/main/assets/modelos
          mkdir -p "$d"
          base=https://huggingface.co
          curl -fsSL -o "$d/slimsam-encoder-q.onnx" "$base/Xenova/slimsam-77-uniform/resolve/main/onnx/vision_encoder_quantized.onnx"
          curl -fsSL -o "$d/slimsam-decoder-q.onnx" "$base/Xenova/slimsam-77-uniform/resolve/main/onnx/prompt_encoder_mask_decoder_quantized.onnx"
          curl -fsSL -o "$d/dinov2-small-q.onnx" "$base/Xenova/dinov2-small/resolve/main/onnx/model_quantized.onnx"
          # Comprueba que son exactamente los modelos con los que se ha probado la app
          cat > modelos.sha256 <<'SUMAS'
          cce23c7b2e5d4f330932738fb67ba518e04b0d99ccdd1cccd22a7da4e01f2971  app/src/main/assets/modelos/slimsam-encoder-q.onnx
          cb90b279f549d2cab7fd6e20c38522438c65d84bdcca3d2a764cff7d857fdce2  app/src/main/assets/modelos/slimsam-decoder-q.onnx
          3afdc8bc63b50558d6e5770f5b799bb82455c2311183a2de43803f343a29d917  app/src/main/assets/modelos/dinov2-small-q.onnx
          SUMAS
          sed -i 's/^ *//' modelos.sha256
          sha256sum -c modelos.sha256

      - name: Copiar onnxruntime-web
        run: |
          set -e
          npm install --no-save --prefix /tmp/ort onnxruntime-web@1.31.1
          d=app/src/main/assets/ort
          mkdir -p "$d"
          cp /tmp/ort/node_modules/onnxruntime-web/dist/ort.wasm.min.js \
             /tmp/ort/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs \
             /tmp/ort/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm "$d/"
          ls -la "$d" app/src/main/assets/modelos

      # Mide el acierto del motor con los mismos modelos que lleva el APK. No impide publicar:
      # el resultado sale en el resumen de la ejecución.
      - name: Banco de pruebas del motor con IA
        continue-on-error: true
        timeout-minutes: 20
        run: |
          pip install --quiet opencv-python-headless numpy
          npm install --no-save --prefix /tmp/pw playwright@1.63.0
          export NODE_PATH=/tmp/pw/node_modules
          python herramientas/casos-control.py --n 2
          estado=0
          node herramientas/banco-reales.js herramientas/casos-control || estado=1
          if ls herramientas/casos-reales/*.json >/dev/null 2>&1; then
            node herramientas/banco-reales.js herramientas/casos-reales --barrido || estado=1
          fi
          exit $estado

      - name: Compilar el APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee compilacion.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          grep -E "error:|e: |FAILURE|What went wrong" -A 3 compilacion.log | head -n 60 | while IFS= read -r l; do
            echo "::error::${l//%/%25}"
          done

      - name: Renombrar el APK
        run: cp app/build/outputs/apk/release/app-release.apk "Calcetines-1.0.${{ github.run_number }}.apk"

      - name: Guardar el APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Calcetines-1.0.${{ github.run_number }}
          path: Calcetines-*.apk

      # Solo se publica desde main; en otras ramas el APK queda en la ejecución
      - name: Publicar la versión
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            "Calcetines-1.0.${{ github.run_number }}.apk" \
            --title "Calcetines 1.0.${{ github.run_number }}" \
            --notes "Descarga el archivo .apk desde el móvil e instálalo. Si Android lo pide, permite instalar apps de este origen."
